[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbox"
version = "0.8.2"
description = "Integrated intelligence stack: Screen Ghost + Axiom-KG + DIND + Attention + Sessions + PLTR Analysis + Genesis Custody"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Jonathan Sandhu", email = "jonathan@sandhuconsulting.com"}
]
keywords = [
    "knowledge-graph",
    "semantic-coordinates",
    "tension-detection",
    "attention-geometry",
    "field-zero",
    "pltr",
    "xbrl",
    "intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.5"]
all = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]
exit = ["blake3", "duckdb>=1.0.0", "pyarrow>=14.0.0", "pandas>=2.0.0", "click>=8.1.0", "cryptography>=41.0.0", "PyNaCl>=1.5.0"]

[project.scripts]
ghostbox-pltr = "ghostbox_pltr.analyzer:main"
ghostbox-demo = "ghostbox.integration:demo_integration"
axm-exit = "foundry_exit.run_ontology_exit:main"
axm-pipeline-exit = "foundry_exit.run_pipeline_exit:main"
axm-logic-exit = "foundry_exit.logic_exit:main"
axm-residual-exit = "foundry_exit.residual_exit:main"
axm-exit-ship = "foundry_exit.ship_of_theseus:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["axiom*", "screen_ghost*", "dind_stack*", "ghostbox*", "ghostbox_pltr*", "foundry_exit*"]

[tool.setuptools.package-dir]
"" = "src"
"foundry_exit" = "foundry_exit"
